query ($since: GitTimestamp!) {
  {{REPOSITORIES}}
}

fragment RepoStatsFragment on Repository {
  languages(first: 15, orderBy: {field: SIZE, direction: DESC}) {
    edges {
      size
      node {
        name
        color
      }
    }
  }
  defaultBranchRef {
    target {
      ... on Commit {
        latestCommit: history(first: 1) {
          nodes {
            committedDate
          }
        }
      }
    }
  }
}
