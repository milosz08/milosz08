name: Build and publish generator to release and M2 OSS central

on:
  push:
    branches:
      - "master"
    paths:
      - ".github/workflows/publish.yml"
      - "gradle/**"
      - "src/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Change wrapper permissions
        run: chmod +x ./gradlew

      - name: Clean build dir
        run: ./gradlew clean --no-daemon

      - name: Package to JAR and publish to M2
        env:
          OSS_M2_USER: ${{ secrets.OSS_M2_USER }}
          OSS_M2_PASSWORD: ${{ secrets.OSS_M2_PASSWORD }}
        run: ./gradlew publishAllPublicationsToM2Repository --no-daemon

      - name: Create versionless JAR file
        run: ./gradlew buildVersionlessJar --no-daemon

      - name: Publish fat JAR to GitHub releases
        uses: ncipollo/release-action@v1
        with:
          artifacts: "build/libs/jargonaut.jar"
          tag: "latest"
          name: "Jargonaut Latest"
          body: |
            Automatically released for CI/CD pipelines.
            **Machine use only.**

            For users seeking versioned releases, please check [artifact repository](https://m2.miloszgilga.pl/#/releases/pl/miloszgilga/jargonaut).
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
          token: ${{ secrets.GITHUB_TOKEN }}
