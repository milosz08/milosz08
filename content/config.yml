defaultLocale: "en_US"
minify: true
seo:
  domain: "https://miloszgilga.pl"
  favicon: "favicon.png"
  ogImage: "og-image.png"
  sameAs:
    - "https://blog.miloszgilga.pl"
    - "https://github.com/c0ifl4x"
    - "https://www.linkedin.com/in/miloszgilga"
analytics:
  gtm: "${env:GTM_ID}"
generator:
  name: "JArgonaut"
  url: "https://github.com/c0ifl4x/c0ifl4x"
  m2Url: "https://m2.miloszgilga.pl/#/releases/pl/miloszgilga/jargonaut"
dir:
  output: "output"
  dictionary: "dictionary"
  globals: "globals"
  sites: "sites"
  styles: "styles"
  scripts: "scripts"
  inlineScripts: "inline-scripts"
cache:
  enabled: true
  cacheDir: ".jargonaut-cache"
extractor:
  github:
    token: "${env:GITHUB_TOKEN}"
    timezone: "Europe/Warsaw"
parser:
  syntax: "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/highlight.min.js"
  math: "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.19.0/katex.min.js"
project:
  rootCategoryId: "uncategorized"
  modifierOrder:
    - "featured"
  statusOrder:
    - "wip"
    - "maintained"
    - "completed"
    - "abandoned"
  recentlyUpdatedDeltaDays: 6
rssOutput: "rss/feed.xml"
additionalAssets:
  - url: "https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.19.0/katex.min.css"
  - url: "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/styles/idea.min.css"
    attributes:
      class: "hljs-theme"
      data-theme-type: "light"
  - url: "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.12.0/styles/androidstudio.min.css"
    attributes:
      class: "hljs-theme"
      data-theme-type: "dark"
